<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matemáticas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }
    header {
      background: #2c3e50;
      color: white;
      text-align: center;
      padding: 30px 16px;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 16px;
    }
    .tema {
      background: white;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>Matemáticas</h1>
    <p>Bienvenido a mi página de matemáticas</p>
  </header>

  <main>
    <div class="tema">
      <h2>Aritmética</h2>
      <p>Suma, resta, multiplicación y división.</p>
    </div>
    <div class="tema">
      <h2>Álgebra</h2>
      <p>Ecuaciones, variables y expresiones.</p>
    </div>
    <div class="tema">
      <h2>Geometría</h2>
      <p>Figuras, áreas y perímetros.</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Matemáticas</p>
  </footer>
</body>
</html>
